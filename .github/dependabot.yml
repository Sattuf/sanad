# تحديثات المكتبات الأسبوعية (Dependabot). تحديثات الثغرات تصل فوراً بمعزل عن هذا الجدول (مفعّلة من الإعدادات).
# الإصدارات الصغرى والتصحيحية مجمّعة في طلب دمج واحد لكل منظومة، والكبرى كلٌّ في طلبه لأنها قد تكسر.
# cooldown: لا يُقترح إصدار قبل مرور 7 أيام على نشره — نسخة مخترقة أو معطوبة تُكتشف عادةً خلالها.
# كل طلب يمر بـ CI كاملاً قبل الدمج (حماية main).
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    ignore:
      # من الإصدار 8 صار ترخيصها مدفوعاً للاستخدام التجاري (Xceed)؛ نبقى على 7.x
      - dependency-name: FluentAssertions
        versions: [">=8"]
      # الإصدار الكبير التالي لـ .NET (11 وما بعده) يأتي مع ترقية المشروع كله في طلب واحد، لا متفرّقاً
      - dependency-name: dotnet-ef
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.*
        update-types: [version-update:semver-major]
    groups:
      dotnet-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/frontend, /ruqyah-app, /packages/shared]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    ignore:
      # ترقيات كبرى تُجرى عمداً في طلب خاص: React 19 مع react-dom وأنواعهما معاً،
      # وeslint 10 بعد أن تدعمه إضافاته (typescript-eslint)
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /mobile_flutter
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    groups:
      pub-minor:
        update-types: [minor, patch]

  # الـ Actions مثبّتة على commit بعينه؛ Dependabot يحدّث المعرّف والإصدار في التعليق معاً
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
