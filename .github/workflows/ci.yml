name: CI

on: [push, pull_request]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks يقرأ قائمة commits طلب الدمج؛ بدون هذه الصلاحية يفشل بـ 403 على أحداث pull_request
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # يفشل البناء إن وُجدت أي بقايا كود دفع — references/07-safety-guardrails.md §7.8
  no-payment-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ! grep -riE "payment|subscription|FinanceOfficer" --include="*.cs" -r src/

  backend:
    needs: [secret-scan, no-payment-code-check]
    runs-on: ubuntu-latest
    env:
      SANAD_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet format --verify-no-changes --severity error
      - run: dotnet list package --vulnerable --include-transitive

  frontend:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # المنطق والمحتوى المشترك بين الويب والجوال (ADR-0018): بلا اعتمادات خارجية، ونص القرآن مطابق حرفياً
  shared:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: packages/shared }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: packages/shared/package-lock.json }
      - run: npm ci
      - run: npm run check:pure
      - run: npm run typecheck
      - run: npm test

  # تطبيق Flutter (ADR-0023): المحتوى والألوان مولَّدة من المصدر، ومتجهات التطابق نفسها التي يشغّلها الويب
  flutter:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile_flutter }
    steps:
      - uses: actions/checkout@v4
      # Node 24: المولّدات تقرأ TypeScript بإزالة الأنواع المدمجة وبخطّاف الحل المتزامن
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: المحتوى والسلامة مطابقان لـ packages/shared
        run: node ../packages/shared/scripts/export-dart.mjs --check
      - name: الألوان مطابقة لـ frontend/src/styles/index.css
        run: node ../frontend/scripts/export-tokens.mjs --check
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.44.3", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      # لقطات المراجعة تختلف بين الأنظمة فلا تُقارن هنا
      - run: flutter test --exclude-tags screenshot

  mobile:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # يثبت أن Metro يحزم التطبيق مع packages/shared للمنصتين (لا يحتاج حساب Expo)
      - run: npm run bundle:check
        env: { CI: "1" }

  # تطبيق «سند» للرقية الذاتية (PWA) — .claude/skills/sanad-ruqyah-app
  ruqyah-app:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ruqyah-app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ruqyah-app/package-lock.json }
      - run: npm ci
      - run: npm run check:guardrails
      # بذور خطط التطوير في الخادم مولَّدة من الخطط المضمَّنة — يجب أن تطابقها
      - run: npm run export:dev-plans && git diff --exit-code ../src/Sanad.Infrastructure/Identity/DevSeed/companion-plans.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
