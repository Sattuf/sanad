name: CI

# دقائق Actions محدودة (مستودع خاص): push على main فقط — فروع طلبات الدمج يغطيها pull_request،
# وكان كل push إليها يشغّل CI مرتين. ودفعة أحدث على الطلب نفسه تلغي التشغيل الجاري.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# كل Action مثبّت على commit بعينه (والإصدار في التعليق): الوسم المتحرك قد يُغيَّر لاحقاً فيشغّل CI كوداً آخر.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks يقرأ قائمة commits طلب الدمج؛ بدون هذه الصلاحية يفشل بـ 403 على أحداث pull_request
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # يفشل البناء إن وُجدت أي بقايا كود دفع — references/07-safety-guardrails.md §7.8
  no-payment-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          ! grep -riE "payment|subscription|FinanceOfficer" --include="*.cs" -r src/

  # تحليل ثابت للكود (SAST): قواعد OWASP العامة لـ C# وTypeScript/React. أي نتيجة تُسقط البناء.
  # (CodeQL يحتاج GitHub Advanced Security في المستودع الخاص؛ Semgrep يعمل خطوةً عادية بلا رفع تقارير.)
  sast:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install semgrep==1.178.0
      - run: >-
          semgrep scan --error --metrics=off
          --config p/csharp --config p/typescript --config p/react --config p/owasp-top-ten --config p/secrets
          --exclude tests --exclude "**/__tests__" --exclude "**/*.test.ts" --exclude "**/*.test.tsx" --exclude e2e
          --exclude "**/Migrations" --exclude mobile_flutter --exclude docs --exclude references

  # ثغرات الاعتماديات المعروفة في npm وFlutter (pub) من قاعدة OSV؛ ‏NuGet يغطيه dotnet list package --vulnerable
  dependency-scan:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=frontend/package-lock.json
            --lockfile=packages/shared/package-lock.json
            --lockfile=ruqyah-app/package-lock.json
            --lockfile=mobile_flutter/pubspec.lock

  backend:
    needs: [secret-scan, no-payment-code-check]
    runs-on: ubuntu-latest
    env:
      SANAD_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "9.0.x" }
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet format --verify-no-changes --severity error
      - run: dotnet list package --vulnerable --include-transitive

  frontend:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # المنطق والمحتوى المشترك بين الويب والجوال (ADR-0018): بلا اعتمادات خارجية، ونص القرآن مطابق حرفياً
  shared:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: packages/shared }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: packages/shared/package-lock.json }
      - run: npm ci
      - run: npm run check:pure
      - run: npm run typecheck
      - run: npm test

  # تطبيق Flutter (ADR-0023): المحتوى والألوان مولَّدة من المصدر، ومتجهات التطابق نفسها التي يشغّلها الويب
  flutter:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile_flutter }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Node 24: المولّدات تقرأ TypeScript بإزالة الأنواع المدمجة وبخطّاف الحل المتزامن
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - name: المحتوى والسلامة مطابقان لـ packages/shared
        run: node ../packages/shared/scripts/export-dart.mjs --check
      - name: الألوان مطابقة لـ frontend/src/styles/index.css
        run: node ../frontend/scripts/export-tokens.mjs --check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.44.3", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      # لقطات المراجعة تختلف بين الأنظمة فلا تُقارن هنا
      - run: flutter test --exclude-tags screenshot

  # تطبيق «سند» للرقية الذاتية (PWA) — .claude/skills/sanad-ruqyah-app
  ruqyah-app:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ruqyah-app }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: ruqyah-app/package-lock.json }
      - run: npm ci
      - run: npm run check:guardrails
      # بذور خطط التطوير في الخادم مولَّدة من الخطط المضمَّنة — يجب أن تطابقها
      - run: npm run export:dev-plans && git diff --exit-code ../src/Sanad.Infrastructure/Identity/DevSeed/companion-plans.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # E2E على الـ API الحقيقي (Development: SQLite وحسابات العرض) والويب المبني، بمحرّكات Chrome وFirefox وWebKit.
  # المفاتيح عشوائية لهذا التشغيل فقط؛ لا سرّ في المستودع.
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      SANAD_API_URL: http://localhost:5080
      SANAD_WEB_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "9.0.x" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Random keys for this run
        run: |
          {
            echo "Auth__Jwt__SigningKeyBase64=$(openssl rand -base64 48)"
            echo "Encryption__FieldKeyBase64=$(openssl rand -base64 32)"
            echo "Otp__HmacKeyBase64=$(openssl rand -base64 32)"
            echo "Storage__UrlSigningKeyBase64=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: dotnet build src/Sanad.Api --configuration Release
      - name: Start the API
        run: nohup dotnet run --project src/Sanad.Api --configuration Release --no-build --urls http://localhost:5080 > api.log 2>&1 &
      - name: Build and serve the web app
        working-directory: frontend
        env: { VITE_API_BASE_URL: http://localhost:5080 }
        run: |
          npm ci
          # طلبات الدمج: Chromium وحده؛ المتصفحات الثلاثة والجوال بعد الدمج في main
          if [ "${{ github.event_name }}" = pull_request ]; then npx playwright install --with-deps chromium
          else npx playwright install --with-deps chromium firefox webkit; fi
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Wait for both servers
        run: |
          for u in "$SANAD_API_URL/api/v1/auth/providers" "$SANAD_WEB_URL/"; do
            for i in $(seq 1 60); do curl -sf -o /dev/null "$u" && break; sleep 2; done
            curl -sf -o /dev/null "$u" || { echo "not up: $u"; cat api.log web.log; exit 1; }
          done
      - name: Playwright
        working-directory: frontend
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--project=desktop' || '' }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
            web.log
          retention-days: 7

  # فحص ديناميكي (DAST): OWASP ZAP يهاجم الـ API وهو يعمل، بكل مسارات OpenAPI وبجلسة مستخدم حقيقية.
  # القواعد المستثناة وأسبابها في .zap/rules.tsv
  dast:
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      # ZAP يرسل آلاف الطلبات من عنوان واحد
      RateLimiting__AuthPerMinute: "100000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "9.0.x" }
      - name: Random keys for this run
        run: |
          {
            echo "Auth__Jwt__SigningKeyBase64=$(openssl rand -base64 48)"
            echo "Encryption__FieldKeyBase64=$(openssl rand -base64 32)"
            echo "Otp__HmacKeyBase64=$(openssl rand -base64 32)"
            echo "Storage__UrlSigningKeyBase64=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: dotnet build src/Sanad.Api --configuration Release
      - name: Start the API
        run: |
          nohup dotnet run --project src/Sanad.Api --configuration Release --no-build --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5080/api/v1/auth/providers && exit 0; sleep 2; done
          cat api.log; exit 1
      # حساب جديد لا حساب عرض: الفحص قد يطلب حذف الحساب أو الخروج فيُبطل جلسته
      - name: Session for the scan
        run: |
          token=$(curl -sf -X POST http://localhost:5080/api/v1/auth/register/email \
            -H 'Content-Type: application/json' -H "Idempotency-Key: zap-$GITHUB_RUN_ID" \
            -d '{"email":"zap@sanad.test","password":"Strong-Pass-123","displayName":"ZAP","acceptTerms":true,"acceptPrivacyPolicy":true}' | jq -r .accessToken)
          echo "::add-mask::$token"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $token" >> "$GITHUB_ENV"
      - uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://localhost:5080/swagger/v1/swagger.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dast-api-log
          path: api.log
          retention-days: 7
