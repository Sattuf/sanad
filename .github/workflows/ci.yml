name: CI

on: [push, pull_request]

# كل Action مثبّت على commit بعينه (والإصدار في التعليق): الوسم المتحرك قد يُغيَّر لاحقاً فيشغّل CI كوداً آخر.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks يقرأ قائمة commits طلب الدمج؛ بدون هذه الصلاحية يفشل بـ 403 على أحداث pull_request
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # يفشل البناء إن وُجدت أي بقايا كود دفع — references/07-safety-guardrails.md §7.8
  no-payment-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          ! grep -riE "payment|subscription|FinanceOfficer" --include="*.cs" -r src/

  # تحليل ثابت للكود (SAST): قواعد OWASP العامة لـ C# وTypeScript/React. أي نتيجة تُسقط البناء.
  # (CodeQL يحتاج GitHub Advanced Security في المستودع الخاص؛ Semgrep يعمل خطوةً عادية بلا رفع تقارير.)
  sast:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install semgrep==1.178.0
      - run: >-
          semgrep scan --error --metrics=off
          --config p/csharp --config p/typescript --config p/react --config p/owasp-top-ten --config p/secrets
          --exclude tests --exclude "**/__tests__" --exclude "**/*.test.ts" --exclude "**/*.test.tsx" --exclude e2e
          --exclude "**/Migrations" --exclude mobile_flutter --exclude docs --exclude references

  # ثغرات الاعتماديات المعروفة في npm وFlutter (pub) من قاعدة OSV؛ ‏NuGet يغطيه dotnet list package --vulnerable
  dependency-scan:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=frontend/package-lock.json
            --lockfile=packages/shared/package-lock.json
            --lockfile=ruqyah-app/package-lock.json
            --lockfile=mobile_flutter/pubspec.lock

  backend:
    needs: [secret-scan, no-payment-code-check]
    runs-on: ubuntu-latest
    env:
      SANAD_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "9.0.x" }
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet format --verify-no-changes --severity error
      - run: dotnet list package --vulnerable --include-transitive

  frontend:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # المنطق والمحتوى المشترك بين الويب والجوال (ADR-0018): بلا اعتمادات خارجية، ونص القرآن مطابق حرفياً
  shared:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: packages/shared }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: packages/shared/package-lock.json }
      - run: npm ci
      - run: npm run check:pure
      - run: npm run typecheck
      - run: npm test

  # تطبيق Flutter (ADR-0023): المحتوى والألوان مولَّدة من المصدر، ومتجهات التطابق نفسها التي يشغّلها الويب
  flutter:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile_flutter }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Node 24: المولّدات تقرأ TypeScript بإزالة الأنواع المدمجة وبخطّاف الحل المتزامن
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - name: المحتوى والسلامة مطابقان لـ packages/shared
        run: node ../packages/shared/scripts/export-dart.mjs --check
      - name: الألوان مطابقة لـ frontend/src/styles/index.css
        run: node ../frontend/scripts/export-tokens.mjs --check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.44.3", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      # لقطات المراجعة تختلف بين الأنظمة فلا تُقارن هنا
      - run: flutter test --exclude-tags screenshot

  # تطبيق «سند» للرقية الذاتية (PWA) — .claude/skills/sanad-ruqyah-app
  ruqyah-app:
    needs: [secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ruqyah-app }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: ruqyah-app/package-lock.json }
      - run: npm ci
      - run: npm run check:guardrails
      # بذور خطط التطوير في الخادم مولَّدة من الخطط المضمَّنة — يجب أن تطابقها
      - run: npm run export:dev-plans && git diff --exit-code ../src/Sanad.Infrastructure/Identity/DevSeed/companion-plans.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
