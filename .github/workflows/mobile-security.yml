name: Mobile security

# فحص ثابت لـ APK الإصدار بـ MobSF: الأذونات، والمكوّنات المكشوفة، وإعدادات الشبكة والنسخ الاحتياطي، والأسرار في الكود.
# بناء الإصدار بطيء فلا يعمل مع كل push: أسبوعياً، ويدوياً، وعند تغيير إعدادات أندرويد أو هذا الملف.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mobile-security.yml
      - .mobsf/**
      - mobile_flutter/android/**
      - mobile_flutter/pubspec.yaml

permissions:
  contents: read

jobs:
  mobsf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # صورة MobSF وبناء Gradle للإصدار معاً أكبر من قرص المشغّل: نحذف أدوات مثبّتة مسبقاً لا نستعملها
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/local/share/powershell /usr/share/miniconda /usr/share/dotnet
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.44.3", channel: stable, cache: true }
      - name: Start MobSF
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "MOBSF_KEY=$key" >> "$GITHUB_ENV"
          # v4.5.3
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$key" \
            opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c
      - name: Build the release APK
        working-directory: mobile_flutter
        run: flutter build apk --release
      - name: Scan
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8000/login/ && break; sleep 5; done
          api() { curl -sf -H "Authorization: $MOBSF_KEY" "http://localhost:8000/api/v1/$@"; }
          hash=$(api upload -F file=@mobile_flutter/build/app/outputs/flutter-apk/app-release.apk | python3 -c 'import json,sys; print(json.load(sys.stdin)["hash"])')
          api scan -d "hash=$hash" > /dev/null
          api report_json -d "hash=$hash" > mobsf-report.json
          api scorecard -d "hash=$hash" > mobsf-scorecard.json
      - name: Findings
        run: python3 .mobsf/check.py mobsf-scorecard.json .mobsf/accepted.json mobsf-report.json mobile_flutter/build/app/outputs/mapping/release/mapping.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobsf-report
          path: |
            mobsf-*.json
            mobile_flutter/build/app/outputs/mapping/release/mapping.txt
          retention-days: 14
